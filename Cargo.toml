[workspace]
members = ["crates/tidvar-core", "crates/tidvar-seal", "crates/tidvar-chain", "crates/tidvar-payer", "crates/tidvar-payee", "services/api", "services/vpn"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["jennycruzy"]
repository = "https://github.com/Jennycruzy/tidvar"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
base64 = "=0.23.1"
blake2b_simd = "1"
reddsa = { version = "=0.5.2", features = ["frost"] }
rand_core = "0.6"
zeroize = { version = "1", features = ["derive"] }
pasta_curves = { version = "0.6", features = ["zeroize"] }
group = "0.14"
ff = "0.14"
ark-bls12-381 = "0.6"
ark-ec = "0.6"
ark-ff = "0.6"
ark-serialize = "0.6"
sha2 = "0.10"
chacha20 = "0.10"
serde_json = "1"
hex = "0.4"
drand_core = { version = "=0.0.19", default-features = false }
orchard = { version = "=0.16.0", default-features = false }
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "8672a4b2d60f432664780e6a4e85f49a36805a2a", default-features = false, features = ["orchard"] }
zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "8672a4b2d60f432664780e6a4e85f49a36805a2a" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "8672a4b2d60f432664780e6a4e85f49a36805a2a" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "8672a4b2d60f432664780e6a4e85f49a36805a2a", default-features = false }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "8672a4b2d60f432664780e6a4e85f49a36805a2a", default-features = false, features = ["orchard"] }
zcash_note_encryption = "=0.5.1"
incrementalmerkletree = "0.9"
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots"] }


zip321 = { git = "https://github.com/zcash/librustzcash", rev = "8672a4b2d60f432664780e6a4e85f49a36805a2a" }

pczt = { git = "https://github.com/zcash/librustzcash", rev = "8672a4b2d60f432664780e6a4e85f49a36805a2a", default-features = false, features = ["zcp-builder", "io-finalizer", "signer"] }
rand_core_new = { package = "rand_core", version = "0.10" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
