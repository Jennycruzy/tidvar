server:
    interface: 10.77.0.1
    access-control: 10.77.0.0/16 allow
    username: "unbound"
    chroot: ""
    pidfile: ""
    directory: "/var/lib/unbound"
    do-daemonize: no
    use-syslog: no
    logfile: ""
    verbosity: 0
    log-queries: no
    log-replies: no
    log-servfail: no
    hide-identity: yes
    hide-version: yes
    do-ip6: no
    harden-glue: yes
    harden-dnssec-stripped: yes
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
