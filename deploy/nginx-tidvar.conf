# Tidvar public page and API. No access log: Tidvar keeps no IP addresses.
server {
    server_name tidvar.38-49-216-59.sslip.io;
    access_log off;
    error_log /var/log/nginx/tidvar-error.log crit;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:27461;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
    }
    listen 80;
    listen [::]:80;
}
