# Tidvar public page and API. No access log: Tidvar keeps no IP addresses.
server {
    server_name tidvar.38-49-216-59.sslip.io;
    access_log off;
    error_log /var/log/nginx/tidvar-error.log crit;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:27461;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tidvar.38-49-216-59.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tidvar.38-49-216-59.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = tidvar.38-49-216-59.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name tidvar.38-49-216-59.sslip.io;
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}